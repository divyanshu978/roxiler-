services:
  postgres:
    image: postgres:16-alpine
    container_name: roxiler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roxiler
    ports:
      - "5433:5432"
    volumes:
      - roxiler-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roxiler"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  roxiler-postgres-data:
